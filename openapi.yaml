openapi: 3.0.3
info:
  title: EDI3 AI Patient Interaction Service
  version: 1.0.0
  description: Microservicio enchufable de procesamiento de mensajes de pacientes vía WhatsApp para consultorios médicos. Implementa clasificación estructurada, RAG normativo y defensa contra inyecciones de prompt.
paths:
  /health:
    get:
      summary: Health Check
      description: Endpoint básico de disponibilidad del microservicio.
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - uptime
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    example: 123.45

  /api/v1/patient-message:
    post:
      summary: Procesar mensaje entrante de paciente
      description: Analiza la intención del paciente, extrae entidades clínicas/administrativas, consulta RAG de normativas y devuelve una respuesta estructurada y segura.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientMessageRequest'
      responses:
        '200':
          description: Procesamiento exitoso con salida tipada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMessageResponse'
        '400':
          description: Payload malformado o validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Límite de tasa excedido (Rate limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno controlado o fallback degradado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/knowledge/documents:
    post:
      summary: Ingestar documento normativo para RAG
      description: Permite a cualquier institución cliente cargar o actualizar políticas, normativas o preparaciones sin tocar código.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentRequest'
      responses:
        '201':
          description: Documento indexado exitosamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - documentId
                  - chunksIndexed
                properties:
                  status:
                    type: string
                    example: "indexed"
                  documentId:
                    type: string
                    example: "aranceles_y_pagos"
                  chunksIndexed:
                    type: integer
                    example: 3
        '400':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PatientMessageRequest:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - patientId
        - phone
        - message
      properties:
        tenantId:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[a-z0-9_-]+$'
          example: "cima-salud"
        patientId:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 42
        phone:
          type: string
          pattern: '^\+?[1-9]\d{7,14}$'
          minLength: 8
          maxLength: 16
          example: "+5491122334455"
        message:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Hola, quisiera saber cuánto cuesta la consulta con la Dra. Scheerle y qué días atiende."
        clinicContext:
          type: object
          additionalProperties: false
          properties:
            clinicName:
              type: string
              example: "Cima Salud Tandil"
            secretaryHours:
              type: string
              example: "Lunes a Viernes hasta las 14:00 hs"
            address:
              type: string
              example: "Montiel 1255, Tandil"
            doctors:
              type: array
              maxItems: 30
              items:
                type: object
                additionalProperties: false
                required:
                  - id
                  - name
                  - specialty
                properties:
                  id:
                    type: integer
                    example: 10
                  name:
                    type: string
                    example: "Maria Cecilia Scheerle"
                  specialty:
                    type: string
                    example: "Psiquiatría"
                  consultationPrice:
                    type: number
                    minimum: 0.01
                    example: 65000.00
                  nextFreeSlot:
                    type: string
                    nullable: true
                    maxLength: 50
                    example: "2026-11-18 10:00"
        conversationHistory:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                minLength: 1
                maxLength: 2000

    PatientMessageResponse:
      type: object
      required:
        - intent
        - confidence
        - actionRequired
        - suggestedReply
        - entities
      properties:
        intent:
          type: string
          enum:
            - SOLICITUD_TURNO
            - CONSULTA_PREPARACION
            - CANCELACION_REPROGRAMACION
            - INFORMACION_HORARIOS
            - OTRO
          example: SOLICITUD_TURNO
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          example: 0.96
        actionRequired:
          type: string
          enum:
            - CREATE_PENDING_BOOKING
            - REPLY_ONLY
            - ESCALATE_HUMAN
          example: CREATE_PENDING_BOOKING
        entities:
          type: object
          properties:
            doctorName:
              type: string
              nullable: true
              example: "Gómez"
            preferredShift:
              type: string
              enum: [manana, tarde, indistinto]
              example: manana
            urgency:
              type: string
              enum: [baja, media, alta]
              example: baja
        suggestedReply:
          type: string
          example: "Hola! Registramos tu solicitud para consultar turnos disponibles con el Dr. Gómez por la mañana. En breve la secretaría te enviará la confirmación."
        ragSources:
          type: array
          items:
            type: string
          example: ["normativa_turnos.md"]
        latencyMs:
          type: number
          example: 450

    KnowledgeDocumentRequest:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - documentId
        - title
        - content
      properties:
        tenantId:
          type: string
          pattern: '^[a-z0-9_-]+$'
          minLength: 2
          maxLength: 64
          example: "cima-salud"
        documentId:
          type: string
          pattern: '^[a-z0-9_-]+$'
          minLength: 2
          maxLength: 64
          example: "aranceles_y_pagos"
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: "Aranceles, Facturación y Medios de Pago"
        content:
          type: string
          minLength: 10
          maxLength: 50000
          example: "# Aranceles\nEl consultorio no tiene convenio directo con obras sociales..."

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "El campo 'message' es obligatorio y debe tener como máximo 1000 caracteres."
