openapi: 3.0.3
info:
  title: EDI3 AI Patient Interaction Service
  version: 1.0.0
  description: Microservicio enchufable de procesamiento de mensajes de pacientes vía WhatsApp para consultorios médicos. Implementa clasificación estructurada, RAG normativo y defensa contra inyecciones de prompt.
paths:
  /health:
    get:
      summary: Health Check
      description: Endpoint básico de disponibilidad del microservicio.
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - uptime
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    example: 123.45

  /api/v1/patient-message:
    post:
      summary: Procesar mensaje entrante de paciente
      description: Analiza la intención del paciente, extrae entidades clínicas/administrativas, consulta RAG de normativas y devuelve una respuesta estructurada y segura.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientMessageRequest'
      responses:
        '200':
          description: Procesamiento exitoso (resultado de inferencia o envelope de contingencia)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PatientMessageResponse'
                  - $ref: '#/components/schemas/InferenceUnavailable'
        '400':
          description: Payload malformado o validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Límite de tasa excedido (Rate limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno controlado o fallback degradado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/knowledge/documents:
    post:
      summary: Ingestar documento normativo para RAG
      description: Permite a cualquier institución cliente cargar o actualizar políticas, normativas o preparaciones sin tocar código.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentRequest'
      responses:
        '201':
          description: Documento indexado exitosamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - documentId
                  - chunksIndexed
                properties:
                  status:
                    type: string
                    example: "indexed"
                  documentId:
                    type: string
                    example: "aranceles_y_pagos"
                  chunksIndexed:
                    type: integer
                    example: 3
        '400':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PatientMessageRequest:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - patientId
        - phone
        - message
      properties:
        tenantId:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[a-z0-9_-]+$'
          example: "cima-salud"
        patientId:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 42
        phone:
          type: string
          pattern: '^\+?[1-9]\d{7,14}$'
          minLength: 8
          maxLength: 16
          example: "+5491122334455"
        message:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Hola, quisiera saber cuánto cuesta la consulta con la Dra. Scheerle y qué días atiende."
        systemConfig:
          type: object
          additionalProperties: false
          properties:
            systemPrompt:
              type: string
              description: Instrucción de sistema completa construida por el cliente.
            systemRole:
              type: string
            operationalRules:
              type: array
              items:
                type: string
            availableTools:
              type: array
              maxItems: 20
              items:
                type: object
                additionalProperties: false
                required: [name, description]
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  params:
                    type: array
                    items:
                      type: string
            neutralReply:
              type: string
            emergencyGuardrail:
              type: object
              required: [terms, reply, actionRequired]
              properties:
                terms:
                  type: array
                  items:
                    type: string
                reply:
                  type: string
                actionRequired:
                  type: string
                  enum: [REPLY_ONLY, CREATE_PENDING_BOOKING, ESCALATE_HUMAN, CALL_TOOL]
            restrictedGuardrail:
              type: object
              required: [terms, reply, actionRequired]
              properties:
                terms:
                  type: array
                  items:
                    type: string
                reply:
                  type: string
                actionRequired:
                  type: string
                  enum: [REPLY_ONLY, CREATE_PENDING_BOOKING, ESCALATE_HUMAN, CALL_TOOL]
            allowedIntents:
              type: array
              items:
                type: string
        businessContext:
          type: object
          additionalProperties: true
          description: Contenedor genérico de contexto de negocio del cliente (sin esquema fijo de dominio).
        clinicContext:
          type: object
          additionalProperties: true
          deprecated: true
          description: Alias obsoleto de businessContext. Se mantiene por compatibilidad.
        conversationHistory:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                minLength: 1
                maxLength: 2000

    PatientMessageResponse:
      type: object
      required:
        - intent
        - confidence
        - actionRequired
        - suggestedReply
        - entities
      properties:
        intent:
          type: string
          description: Intención clasificada (definida por `allowedIntents` del cliente).
          example: SOLICITUD_TURNO
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          example: 0.96
        actionRequired:
          type: string
          enum:
            - CREATE_PENDING_BOOKING
            - REPLY_ONLY
            - ESCALATE_HUMAN
            - CALL_TOOL
          example: CREATE_PENDING_BOOKING
        toolCall:
          type: object
          required: [tool]
          properties:
            tool:
              type: string
            params:
              type: object
              additionalProperties: true
        entities:
          type: object
          additionalProperties: true
          description: Entidades extraídas del dominio del cliente (esquema abierto).
        suggestedReply:
          type: string
          example: "Hola! Registramos tu solicitud. En breve te enviaremos la confirmación."
        ragSources:
          type: array
          items:
            type: string
          example: ["normativa_turnos.md"]
        latencyMs:
          type: number
          example: 450
        engineUsed:
          type: string
          example: "gemini-3.5-flash-lite"

    InferenceUnavailable:
      type: object
      required: [ok, error, latencyMs]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
          enum: [INFERENCE_UNAVAILABLE]
        latencyMs:
          type: number
          example: 20000

    KnowledgeDocumentRequest:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - documentId
        - title
        - content
      properties:
        tenantId:
          type: string
          pattern: '^[a-z0-9_-]+$'
          minLength: 2
          maxLength: 64
          example: "cima-salud"
        documentId:
          type: string
          pattern: '^[a-z0-9_-]+$'
          minLength: 2
          maxLength: 64
          example: "aranceles_y_pagos"
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: "Aranceles, Facturación y Medios de Pago"
        content:
          type: string
          minLength: 10
          maxLength: 50000
          example: "# Aranceles\nEl consultorio no tiene convenio directo con obras sociales..."

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "El campo 'message' es obligatorio y debe tener como máximo 1000 caracteres."
