name: CI / Adversarial Evals Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evals-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.19.0

      - name: Install Hurl
        run: |
          curl --location --remote-name https://github.com/Orange-OpenSource/hurl/releases/download/5.0.1/hurl_5.0.1_amd64.deb
          sudo dpkg -i hurl_5.0.1_amd64.deb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: pnpm exec tsc --noEmit

      - name: Run Background Fastify Server
        run: |
          pnpm exec tsx src/index.ts &
          sleep 3

      - name: Execute Full Breaker & Contract Test Suite (79 Requests)
        run: |
          hurl --test \
            tests/000_health.hurl \
            tests/001_patient_message.hurl \
            tests/002_adversarial_breaker.hurl \
            tests/003_rag_breaker.hurl \
            tests/004_conversation_history_breaker.hurl \
            tests/005_production_hardening_breaker.hurl
